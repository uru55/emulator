<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="emu">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    .box { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 24px; border-top: 1px solid #333; padding-top: 16px; }
    #list { display: grid; align-items: start; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-top: 12px; }
    .card { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .cover { display: block; width: 100%; cursor: pointer; background: #262626; }
    img.cover { height: auto; }
    .cover.noimg { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #666; }
    .cover:hover { filter: brightness(1.15); }
    .title { padding: 8px; font-size: 14px; line-height: 1.4; flex: 1; }
    #consoles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 12px; }
    .console { background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 12px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s; }
    .console:hover { transform: translateY(-2px); border-color: #2d5bd7; }
    .console img { width: 100%; height: 120px; object-fit: contain; }
    .console .cname { margin-top: 8px; font-size: 15px; }
    .console .count { color: #999; font-size: 12px; margin-top: 2px; }
    .console.off { opacity: .45; }
    #back { margin-bottom: 4px; }
    .ops { display: flex; border-top: 1px solid #333; }
    .ops button { flex: 1; border: none; border-radius: 0; padding: 6px; font-size: 12px; background: transparent; color: #aaa; }
    .ops button:hover { background: #2a2a2a; }
    button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 10px 12px; font-size: 15px; cursor: pointer; }
    button:hover { background: #3a3a3a; }
    button.main { background: #2d5bd7; border-color: #2d5bd7; }
    button.danger { color: #ff8a8a; }
    input, select { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 8px; background: #1c1c1c; color: #eee; border: 1px solid #444; border-radius: 6px; font-size: 15px; }
    input[type=checkbox] { width: auto; margin-right: 6px; }
    .note { color: #999; font-size: 13px; line-height: 1.6; }
    code { background: #222; padding: 2px 6px; border-radius: 4px; user-select: all; word-break: break-all; }
    details { margin-top: 24px; border-top: 1px solid #333; padding-top: 12px; }
    summary { cursor: pointer; font-size: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    #login, #denied, #menu { display: none; }
    #wrap { width: 100%; height: 100vh; height: 100dvh; display: none; flex-direction: column; } /* dvh = スマホのアドレスバーを除いた高さ */
    #status { padding: 16px; }
    #bar { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 8px; background: #181818; border-bottom: 1px solid #333; }
    #quit { width: 36px; height: 32px; padding: 0; font-size: 16px; line-height: 1; }
    #menuBtn { width: 36px; height: 32px; padding: 0; font-size: 18px; line-height: 1; margin-left: auto; flex: none; }
    .ejs_virtualGamepad_open { display: none !important; } /* EmulatorJSの☰は隠して、上のバーの☰を使う */
    /* DS：仮想パッドの透明な部分がタッチを横取りしないようにする（ボタン自体は押せる） */
    #game.nds .ejs_virtualGamepad_parent { pointer-events: none; }
    #game.nds .ejs_virtualGamepad_parent .ejs_virtualGamepad_button,
    #game.nds .ejs_virtualGamepad_parent .ejs_dpad_main,
    #game.nds .ejs_virtualGamepad_parent [class*=" b_"] { pointer-events: auto; }
    #playing { flex: 1; min-width: 0; font-size: 14px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #game { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <!-- ログイン -->
  <div id="login" class="box">
    <h1>emu</h1>
    <p><button class="main" id="signin">Googleでログイン</button></p>
    <label class="note"><input type="checkbox" id="temp">このPCにログインを残さない</label>
  </div>

  <!-- 許可されていないアカウント -->
  <div id="denied" class="box">
    <h1>🔒 このアカウントでは使えません</h1>
    <p class="note">はじめて設定するときは、下のUIDをFirestoreのルールに貼ってください。</p>
    <p>UID：<code id="uid"></code></p>
    <button id="signout2">ログアウト</button>
  </div>

  <!-- ゲーム一覧 -->
  <div id="menu" class="box">
    <div class="top">
      <h1 id="heading">ゲーム機を選ぶ</h1>
      <button id="signout">ログアウト</button>
    </div>
    <div id="consoles"></div>
    <div id="gamesView" style="display:none">
      <button id="back">← ゲーム機一覧</button>
      <div id="list"></div>
      <p class="note" id="empty">この機種のゲームはまだありません。下の「管理」から追加してください。</p>
    </div>

    <details id="admin" style="display:none">
      <summary>管理（ゲームの追加）</summary>

      <h2>① ROMを暗号化する</h2>
      <p class="note">ROMを選ぶと、暗号化したファイル（〜.enc）がダウンロードされます。それをDropboxにアップロードして、共有リンクをコピーしてください。元のROMはDropboxに上げないでください。</p>
      <input type="file" id="romFile">
      <p class="note" id="encMsg"></p>

      <h2>② 一覧に追加する</h2>
      <label>ゲーム名</label>
      <input id="name" placeholder="例：スーパーマリオワールド">
      <label>機種</label>
      <select id="core">
        <option value="nes">ファミコン（NES）</option>
        <option value="snes">スーパーファミコン（SNES）</option>
        <option value="gb">ゲームボーイ / カラー</option>
        <option value="gba">ゲームボーイアドバンス</option>
        <option value="n64">NINTENDO 64</option>
        <option value="nds">ニンテンドーDS</option>
        <option value="segaMD">メガドライブ</option>
      </select>
      <label>パッケージ画像（なくてもOK・あとから追加もできます）</label>
      <input type="file" id="cover" accept="image/*">
      <label>暗号化したファイルのDropbox共有リンク</label>
      <input id="url" placeholder="https://www.dropbox.com/scl/fi/.../〜.enc?...">
      <button class="main" id="add">追加する</button>
      <p class="note">追加すると、ほかの端末にもすぐ反映されます。</p>
    </details>

  </div>

  <!-- ゲーム画面 -->
  <div id="wrap">
    <div id="bar"><button id="quit" title="やめる" aria-label="やめる">✕</button><span id="playing"></span><button id="menuBtn" title="メニュー" aria-label="メニュー">☰</button></div>
    <div id="status"></div>
    <div id="game"></div>
  </div>

    ];
    let games = [];
    let isAdmin = false;    // 見出しを10回タップすると管理者モード（このタブの中だけ）
    let currentCore = null; // null = ゲーム機一覧を表示
    let unsub = null;

    function show(id) {
      for (const x of ['login', 'denied', 'menu', 'wrap']) $(x).style.display = x === id ? (x === 'wrap' ? 'flex' : 'block') : 'none';
    }

    // ---------- ログイン ----------
    $('signin').onclick = async () => {
      try {
        await setPersistence(auth, $('temp').checked ? browserSessionPersistence : browserLocalPersistence);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' }); // 毎回アカウントを選ぶ画面を出す
        await signInWithPopup(auth, provider);
      } catch (e) { alert('ログインできませんでした：' + e.code); }
    };
    $('signout').onclick = $('signout2').onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (unsub) { unsub(); unsub = null; }
      cryptoKey = null;
      if (!user) { show('login'); return; }
      try {
        cryptoKey = await loadKey();
      } catch (e) {
        // ルールで許可されていないアカウント
        $('uid').textContent = user.uid;
        show('denied');
        return;
      }
      unsub = onSnapshot(query(collection(db, 'games'), orderBy('name')), snap => {
        games = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });
      currentCore = decodeURIComponent(location.hash.slice(1)) || null;
      render();
      show('menu');
    });

    // ---------- 管理者モード（見出しを3秒以内に10回タップ） ----------
    let taps = [];
    $('heading').addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(t => now - t < 3000);
      taps.push(now);
      if (taps.length >= 10) {
        taps = [];
        isAdmin = !isAdmin;
        render();
        alert(isAdmin ? '管理者モードになりました' : '管理者モードを終了しました');
      }
    });
    $('heading').style.userSelect = 'none';

    // ---------- 画面の切り替え（ブラウザの「戻る」も使える） ----------
    function readHash() {
      const h = decodeURIComponent(location.hash.slice(1));
      currentCore = h || null;
      render();
    }
    window.addEventListener('hashchange', readHash);
    $('back').onclick = () => { location.hash = ''; };

    // ---------- 鍵（なければ最初に作る） ----------
    async function loadKey() {
      const ref = doc(db, 'secret', 'key');
      const snap = await getDoc(ref);   // 許可されていないとここでエラー
      let raw;
      if (snap.exists()) {
        raw = Uint8Array.from(atob(snap.data().key), c => c.charCodeAt(0));
      } else {
        raw = crypto.getRandomValues(new Uint8Array(32));
        await setDoc(ref, { key: btoa(String.fromCharCode(...raw)) });
      }
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    }

    async function encryptBytes(data) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, data));
      const out = new Uint8Array(4 + 12 + ct.length);
      out.set(MAGIC, 0); out.set(iv, 4); out.set(ct, 16);
      return out;
    }
    async function decryptBytes(buf) {
      const b = new Uint8Array(buf);
      if (b.length < 16 || MAGIC.some((v, i) => b[i] !== v)) throw new Error('このページで暗号化したファイルではありません');
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(4, 16) }, cryptoKey, b.slice(16));
    }

    // ---------- 一覧 ----------
    function render() {
      $('admin').style.display = isAdmin ? 'block' : 'none';
      if (currentCore) renderGames(); else renderConsoles();
    }

    function renderConsoles() {
      $('heading').textContent = 'ゲーム機を選ぶ';
      $('consoles').style.display = 'grid';
      $('gamesView').style.display = 'none';
      const box = $('consoles');
      box.innerHTML = '';
      const known = CONSOLES.map(c => c.core);
      const list = [...CONSOLES];
      // 一覧にない機種（メガドライブなど）のゲームがあれば「その他」を出す
      if (games.some(g => !known.includes(g.core))) list.push({ core: 'other', name: 'その他', img: '' });
      for (const c of list) {
        const n = c.core === 'other' ? games.filter(g => !known.includes(g.core)).length
                                     : games.filter(g => g.core === c.core).length;
        const el = document.createElement('div');
        el.className = 'console' + (c.unsupported ? ' off' : '');
        if (c.img) { const im = document.createElement('img'); im.src = c.img; im.alt = c.name; el.appendChild(im); }
        else { const ph = document.createElement('div'); ph.style.cssText = 'height:120px;display:flex;align-items:center;justify-content:center;font-size:48px'; ph.textContent = '🕹️'; el.appendChild(ph); }
        const nm = document.createElement('div'); nm.className = 'cname'; nm.textContent = c.name;
        const ct = document.createElement('div'); ct.className = 'count';
        ct.textContent = c.unsupported ? 'ブラウザでは遊べません' : n + '本';
        el.append(nm, ct);
        el.onclick = () => {
          if (c.unsupported) { alert(c.name + 'はブラウザのエミュレータ（EmulatorJS）に対応していないため、このページでは遊べません。'); return; }
          location.hash = c.core;
        };
        box.appendChild(el);
      }
    }

    function renderGames() {
      const c = CONSOLES.find(x => x.core === currentCore) || { name: 'その他' };
      const known = CONSOLES.map(x => x.core);
      const shown = currentCore === 'other' ? games.filter(g => !known.includes(g.core))
                                            : games.filter(g => g.core === currentCore);
      $('heading').textContent = c.name;
      $('consoles').style.display = 'none';
      $('gamesView').style.display = 'block';
      if (currentCore !== 'other' && $('core').querySelector('option[value="' + currentCore + '"]')) $('core').value = currentCore;
      const list = $('list');
      list.innerHTML = '';
      $('empty').style.display = shown.length ? 'none' : 'block';
      $('empty').textContent = isAdmin ? 'この機種のゲームはまだありません。下の「管理」から追加してください。' : 'この機種のゲームはまだありません。';
      for (const g of shown) {
        const card = document.createElement('div');
        card.className = 'card';

        let cover;
        if (g.cover) {
          cover = document.createElement('img');   // 画像の縦横比のまま表示
          cover.src = g.cover;
          cover.alt = g.name;
          cover.className = 'cover';
        } else {
          cover = document.createElement('div');
          cover.className = 'cover noimg';
          cover.textContent = '画像なし';
        }
        cover.title = g.name + ' を遊ぶ';
        cover.onclick = () => start(g);

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = g.name;

        const ops = document.createElement('div');
        ops.className = 'ops';
        const img = document.createElement('button');
        img.textContent = '画像';
        img.onclick = () => pickCover(g);
        const del = document.createElement('button');
        del.textContent = '削除';
        del.onclick = async () => {
          if (!confirm(g.name + ' を一覧から消しますか？')) return;
          try { await deleteDoc(doc(db, 'games', g.id)); } catch (e) { alert('削除できませんでした'); }
        };
        ops.append(img, del);

        card.append(cover, title);
        if (isAdmin) card.append(ops);
        list.appendChild(card);
      }
    }

    // ---------- パッケージ画像（縮小してFirestoreに保存） ----------
    function resizeImage(file, maxW = 480, maxH = 480) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const im = new Image();
        im.onload = () => {
          const r = Math.min(1, maxW / im.width, maxH / im.height);
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * r);
          c.height = Math.round(im.height * r);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.8)); // だいたい30〜60KB
        };
        im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
        im.src = url;
      });
    }

    function pickCover(g) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try { await updateDoc(doc(db, 'games', g.id), { cover: await resizeImage(file) }); }
        catch (e) { alert('画像を保存できませんでした：' + (e.code || e.message)); }
      };
      input.click();
    }


    // ---------- 管理 ----------
    function download(data, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data]));
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    function toDirect(link) {
      try {
        const u = new URL(link.trim());
        if (!u.hostname.endsWith('dropbox.com')) return null;
        u.hostname = 'dl.dropboxusercontent.com';
        u.searchParams.delete('dl');
        u.searchParams.delete('raw');
        return u.toString();
      } catch (e) { return null; }
    }

    let lastFileName = '';
    $('romFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !isAdmin) return;
      $('encMsg').textContent = '暗号化中…';
      download(await encryptBytes(await file.arrayBuffer()), file.name + '.enc');
      lastFileName = file.name;
      $('encMsg').textContent = '「' + file.name + '.enc」を保存しました。Dropboxにアップロードしてリンクを②に貼ってください。';
      if (!$('name').value) $('name').value = file.name.replace(/\.[^.]+$/, '');
      e.target.value = '';
    };

    $('add').onclick = async () => {
      if (!isAdmin) return;
      const name = $('name').value.trim();
      const core = $('core').value;
      const url = toDirect($('url').value);
      if (!name) { alert('ゲーム名を入れてください'); return; }
      if (!url) { alert('Dropboxの共有リンクを入れてください'); return; }
      const fromUrl = decodeURIComponent(new URL(url).pathname.split('/').pop()).replace(/\.enc$/, '');
      const file = fromUrl.includes('.') ? fromUrl : (lastFileName || name);
      try {
        const coverFile = $('cover').files[0];
        const data = { name, core, url, file, createdAt: serverTimestamp() };
        if (coverFile) data.cover = await resizeImage(coverFile);
        await addDoc(collection(db, 'games'), data);
        $('name').value = ''; $('url').value = ''; $('cover').value = '';
      } catch (e) { alert('追加できませんでした：' + e.code); }
    };


    // ---------- ゲーム開始：ダウンロード → 復号 → 起動 ----------
    // ---------- 仮想パッドの FAST / SLOW ボタンを消す ----------
    new MutationObserver(() => {
      for (const el of $('game').querySelectorAll('div, button, span')) {
        if (el.children.length === 0 && /^(fast|slow)$/i.test(el.textContent.trim())) {
          el.style.display = 'none';
        }
      }
    }).observe($('game'), { childList: true, subtree: true });

    // ---------- ゲーム内セーブを端末に残す ----------
    // EmulatorJSまかせだと保存が間に合わず消えることがあるので、
    // このページ自身の保存場所（IndexedDB「emu-saves」）にゲームごとに保存しておく。
    let curGame = null;
    let lastSaved = null;
    let saving = null;
    function openSaveDb() {
      return new Promise((resolve, reject) => {
        const r = indexedDB.open('emu-saves', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('sram');
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    async function dbGet(key) {
      const db = await openSaveDb();
      return new Promise((resolve, reject) => {
        const q = db.transaction('sram').objectStore('sram').get(key);
        q.onsuccess = () => resolve(q.result);
        q.onerror = () => reject(q.error);
      });
    }
    async function dbPut(key, value) {
      const db = await openSaveDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('sram', 'readwrite');
        tx.objectStore('sram').put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    const sameBytes = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
    const gameManager = () => window.EJS_emulator && window.EJS_emulator.gameManager;

    // ゲームが始まったら、保存しておいたセーブを読み込ませる
    async function restoreSave(g) {
      curGame = g;
      const gm = gameManager();
      if (!gm) return;
      try {
        const data = await dbGet(g.id);
        if (!data || !data.length) return;
        const path = gm.getSaveFilePath();
        const dir = path.substring(0, path.lastIndexOf('/'));
        if (dir) { try { gm.FS.mkdirTree ? gm.FS.mkdirTree(dir) : gm.FS.mkdir(dir); } catch (e) {} }
        try { gm.FS.unlink(path); } catch (e) {}
        gm.FS.writeFile(path, data);
        gm.loadSaveFiles();
        // ゲームにセーブを読み直させるためにリセット
        if (gm.restart) gm.restart();
        else if (gm.functions && gm.functions.restart) gm.functions.restart();
        lastSaved = data;
      } catch (e) { console.warn('セーブの読み込みに失敗', e); }
    }

    // 今のゲーム内セーブを保存（変わっていたときだけ）
    function storeSave() {
      if (saving) return saving;
      saving = (async () => {
        const gm = gameManager();
        if (!curGame || !gm) return;
        let data;
        try { data = gm.getSaveFile(); } catch (e) { return; }
        if (!data || !data.length || sameBytes(data, lastSaved)) return;
        const copy = new Uint8Array(data);
        await dbPut(curGame.id, copy);
        lastSaved = copy;
      })().catch(e => console.warn('セーブの保存に失敗', e)).finally(() => { saving = null; });
      return saving;
    }
    // ---------- ボタン配置（キーボード・コントローラー）を機種ごとに残す ----------
    // EmulatorJSはボタン配置をゲームごとに覚えるうえ、キーボードの変更は保存されないことがあるので、
    // このページで機種ごとに localStorage「emu-controls-機種」に保存し、起動のたびに当て直す。
    let lastControls = '';
    function applyControls(core) {
      const emu = window.EJS_emulator;
      if (!emu) return;
      try {
        const saved = localStorage.getItem('emu-controls-' + core);
        if (saved) {
          emu.controls = JSON.parse(saved);
          if (emu.checkGamepadInputs) emu.checkGamepadInputs();
          if (emu.saveSettings) emu.saveSettings();
        }
        lastControls = JSON.stringify(emu.controls || {});
      } catch (e) { console.warn('ボタン配置の読み込みに失敗', e); }
    }
    function storeControls() {
      const emu = window.EJS_emulator;
      if (!curGame || !emu || !emu.controls) return;
      try {
        const now = JSON.stringify(emu.controls);
        if (now === lastControls) return;
        localStorage.setItem('emu-controls-' + curGame.core, now);
        lastControls = now;
      } catch (e) {}
    }
    setInterval(storeControls, 3000);  // 3秒ごとに確認

    setInterval(storeSave, 15000);   // 15秒ごとに確認
    document.addEventListener('visibilitychange', () => { if (document.hidden) { storeControls(); storeSave(); } });

    // ---------- DSのタッチ操作 ----------
    // スマホの指のタッチを、ゲーム画面（canvas）へのマウス操作に変換して渡す。
    // エミュレータ側は「Touch（ポインター）」モードにして、押した場所をそのままタッチ位置として使う。
    function enableDsTouch() {
      const canvas = $('game').querySelector('canvas');
      if (!canvas || canvas.dataset.touch) return;
      canvas.dataset.touch = '1';
      canvas.style.touchAction = 'none';
      const send = (type, t) => canvas.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY,
        button: 0, buttons: type === 'mouseup' ? 0 : 1
      }));
      let id = null;
      canvas.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        if (id !== null) return;
        id = t.identifier;
        e.preventDefault();
        send('mousemove', t); send('mousedown', t);
      }, { passive: false });
      canvas.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) if (t.identifier === id) { e.preventDefault(); send('mousemove', t); }
      }, { passive: false });
      const end = e => {
        for (const t of e.changedTouches) if (t.identifier === id) { e.preventDefault(); send('mouseup', t); id = null; }
      };
      canvas.addEventListener('touchend', end, { passive: false });
      canvas.addEventListener('touchcancel', end, { passive: false });
    }

    // ---------- ゲームをやめる（「✕」ボタン・ブラウザの「戻る」） ----------
    let playing = false;
    let quitting = false;
    async function quitGame() {
      if (quitting) return;
      quitting = true;
      $('playing').textContent = '保存中…';
      storeControls();
      try {
        await Promise.race([storeSave(), new Promise(r => setTimeout(r, 5000))]);
        window.EJS_emulator?.gameManager?.saveSaveFiles?.();
      } catch (e) {}
      setTimeout(() => location.reload(), 500); // 遊んでいた機種のゲーム一覧に戻る
    }
    // 上のバーの☰で、EmulatorJSのメニューを開け閉めする
    $('menuBtn').onclick = () => { try { window.EJS_emulator.menu.toggle(); } catch (e) {} };

    $('quit').onclick = () => { if (playing) history.back(); else quitGame(); };
    window.addEventListener('popstate', () => { if (playing) { playing = false; quitGame(); } });

    async function start(g) {
      playing = true;
      history.pushState({ playing: true }, '', location.href);
      show('wrap');
      $('playing').textContent = g.name;
      const status = $('status');
      try {
        status.textContent = '読み込み中…';
        const res = await fetch(g.url);
        if (!res.ok) throw new Error('ダウンロードできませんでした（' + res.status + '）');
        const total = Number(res.headers.get('content-length')) || 0;
        const reader = res.body.getReader();
        const chunks = []; let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value); got += value.length;
          status.textContent = '読み込み中… ' + (got / 1048576).toFixed(1) + 'MB' +
            (total ? ' / ' + (total / 1048576).toFixed(1) + 'MB' : '');
        }
        status.textContent = '復号中…';
        const plain = await decryptBytes(await new Blob(chunks).arrayBuffer());
        status.style.display = 'none';
        if (unsub) { unsub(); unsub = null; }  // 遊んでいる間は一覧の更新を止める

        window.EJS_player = '#game';
        window.EJS_core = g.core;
        window.EJS_gameUrl = new File([plain], g.file || g.name);
        window.EJS_gameName = g.name;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
        if (g.core === 'nds') {
          $('game').classList.add('nds');
          // タッチ画面をポインター（押した場所＝タッチ位置）で操作する設定
          window.EJS_defaultOptions = { melonds_touch_mode: 'Touch', desmume_pointer_type: 'touch' };
        }
        // 起動したときに自動で開くメニューを閉じる
        window.EJS_onGameStart = () => {
          curGame = g;
          applyControls(g.core);
          restoreSave(g);
          if (g.core === 'nds') for (const t of [100, 1000, 3000]) setTimeout(enableDsTouch, t);
          for (const t of [50, 300, 1000]) setTimeout(() => { try { window.EJS_emulator.menu.close(); } catch (e) {} }, t);
        };
        const s = document.createElement('script');
        s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(s);
      } catch (e) {
        alert((e && e.name === 'OperationError') ? '復号できませんでした（別の鍵で暗号化されたファイルです）' : e.message);
        location.reload();
      }
    }
  </script>
  <script>
    // アプリとしてインストールできるようにする
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
